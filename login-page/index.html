 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyPatientHUB</title>

    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
</head>

<body>

    <!-- Header / Background -->
    <section class="hero">

        <div class="hero-content">
            <h1>Welcome to Sky Wings!</h1>

            <p>
                  
              We provide safe, comfortable, and memorable journeys with Sky Wings.
            </p>
        </div>

        <!-- Login Card -->
        <div class="login-card">

            <h2>Sign in to Sky Wings</h2>

            <!-- Social Login -->
            <div class="social-buttons">
                <button class="social-btn facebook">
               <i class="fa-brands fa-facebook-f"></i>
                </button>

                <button class="social-btn google">

                    <i class="fa-brands fa-google"></i>
                </button>

            </div>

            <!-- Login Form -->
            <form>

                <input
                    type="text"
                    placeholder="Email or Phone number"
                >

                <input
                    type="password"
                    placeholder="Please enter your password"
                >

                <button class="sign-in">
                    SIGN IN
                </button>

            </form>

            <!-- Remember -->
            <div class="options">

                <a href="#">Forgot password?</a>

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

            </div>

            <div class="or">
                <span>or</span>
            </div>

            <!-- Sign Up -->
            <button class="sign-up">
                SIGN UP
            </button>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <a href="#">Google Play Store APP</a>
        <a href="#">App Store APP</a>
        <a href="#">About MyPatientHUB</a>
        <a href="#">About Us</a>
        <a href="#">Our Blog</a>

    </footer>

</body>
</html>

     
</body>
</html>
